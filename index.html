<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Malibu Response V8 Simulator</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #87CEEB; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #dashboard {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 12px;
            color: #00ffcc;
            border: 2px solid #333;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            min-width: 120px;
            pointer-events: none;
        }
        
        .gauge { margin-bottom: 5px; }
        .gauge-title { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px;}
        .gauge-value { font-size: 22px; font-weight: bold; text-shadow: 0 0 10px #00ffcc; }
        
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 10px;
            color: white;
            pointer-events: none;
            max-width: 200px;
        }
        h1 { margin: 0 0 5px 0; font-size: 16px; color: #ff3366; }
        p { margin: 2px 0; font-size: 11px; }

        /* TOUCH CONTROLS */
        .touch-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .touch-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            background: rgba(255, 51, 102, 0.6);
            transform: scale(0.95);
        }

        .btn-pedal {
            border-radius: 15px;
            width: 65px;
            height: 80px;
            font-size: 14px;
        }

        /* Am PC Touch-Buttons etwas dezenter machen oder anzeigen */
        @media (min-width: 1024px) {
            .touch-container { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>Malibu Response V8</h1>
        <p>Achtung: Physik & Wellen in Echtzeit!</p>
    </div>

    <div id="dashboard">
        <div class="gauge">
            <div class="gauge-title">Speed</div>
            <div class="gauge-value" id="ui-speed">0 <span style="font-size:12px">km/h</span></div>
        </div>
        <div class="gauge">
            <div class="gauge-title">RPM</div>
            <div class="gauge-value" id="ui-rpm" style="color: #ff3366; text-shadow: 0 0 10px #ff3366;">800</div>
        </div>
    </div>

    <!-- TOUCH STEUERUNG FÜR HANDY -->
    <div class="touch-container">
        <!-- Lenkung Links -->
        <div class="touch-group">
            <div class="btn" id="btn-a">◀</div>
            <div class="btn" id="btn-d">▶</div>
        </div>
        <!-- Gas / Bremse Rechts -->
        <div class="touch-group">
            <div class="btn btn-pedal" id="btn-s" style="background: rgba(255, 0, 0, 0.3);">BREMSE</div>
            <div class="btn btn-pedal" id="btn-w" style="background: rgba(0, 255, 128, 0.3);">GAS</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0/build/three.module.js';

        // --- SETUP SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance auf Handys optimieren
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- LICHT ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 100, 50);
        scene.add(dirLight);

        // --- DAS WASSER ---
        const waterSize = 300;
        const waterSegments = 100; // Für flüssige Performance auf Mobilgeräten leicht angepasst
        const waterGeometry = new THREE.PlaneGeometry(waterSize, waterSize, waterSegments, waterSegments);
        waterGeometry.rotateX(-Math.PI / 2);

        const waterMaterial = new THREE.MeshPhongMaterial({
            color: 0x006994,
            transparent: true,
            opacity: 0.9,
            shininess: 80,
            flatShading: true
        });
        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        scene.add(water);

        const originalPositions = Array.from(waterGeometry.attributes.position.array);
        const wakes = [];

        // --- DAS BOOT ---
        const boat = new THREE.Group();
        scene.add(boat);

        // Rumpf
        const hullGeo = new THREE.BoxGeometry(2.2, 1, 5);
        const hullMat = new THREE.MeshPhongMaterial({ color: 0xcc0000 });
        const hull = new THREE.Mesh(hullGeo, hullMat);
        hull.position.y = 0.2;
        boat.add(hull);

        // Deck
        const deckGeo = new THREE.BoxGeometry(2.3, 0.2, 5.1);
        const deckMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
        const deck = new THREE.Mesh(deckGeo, deckMat);
        deck.position.y = 0.7;
        boat.add(deck);

        // Bug
        const bowGeo = new THREE.CylinderGeometry(0, 1.15, 2, 3);
        const bow = new THREE.Mesh(bowGeo, hullMat);
        bow.rotation.x = Math.PI / 2;
        bow.rotation.y = -Math.PI / 2;
        bow.position.set(0, 0.2, -3.5);
        boat.add(bow);

        // Windschutzscheibe
        const glassGeo = new THREE.BoxGeometry(1.8, 0.6, 0.1);
        const glassMat = new THREE.MeshPhongMaterial({ color: 0x222222, transparent: true, opacity: 0.7 });
        const glass = new THREE.Mesh(glassGeo, glassMat);
        glass.position.set(0, 1.1, -1);
        glass.rotation.x = -Math.PI / 6;
        boat.add(glass);

        // Tower
        const towerGeo = new THREE.TorusGeometry(1.1, 0.05, 8, 24, Math.PI);
        const towerMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
        const tower = new THREE.Mesh(towerGeo, towerMat);
        tower.position.set(0, 0.8, 0.5);
        tower.rotation.x = -0.2;
        boat.add(tower);

        // --- PHYSIK & STEUERUNG ---
        const physics = {
            speed: 0,
            maxSpeed: 22,
            acceleration: 6,
            drag: 0.98,
            heading: Math.PI,
            rpm: 800,
            throttle: 0
        };

        const keys = { w: false, a: false, s: false, d: false };

        // TASTATUR STEUERUNG (PC)
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (e.key.toLowerCase() === 's' || e.key === 'ArrowDown') keys.s = true;
            if (e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (e.key.toLowerCase() === 's' || e.key === 'ArrowDown') keys.s = false;
            if (e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        // TOUCH STEUERUNG (HANDY)
        const bindTouch = (id, key) => {
            const btn = document.getElementById(id);
            const start = (e) => { e.preventDefault(); keys[key] = true; };
            const end = (e) => { e.preventDefault(); keys[key] = false; };

            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('touchcancel', end, { passive: false });
            
            // Für Mausklicks auf dem PC-Test
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        };

        bindTouch('btn-w', 'w');
        bindTouch('btn-s', 's');
        bindTouch('btn-a', 'a');
        bindTouch('btn-d', 'd');

        // UI Updates
        const uiSpeed = document.getElementById('ui-speed');
        const uiRpm = document.getElementById('ui-rpm');

        // --- MAIN LOOP ---
        const clock = new THREE.Clock();
        let wakeTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            // V8 Engine Logic
            if (keys.w) physics.throttle = THREE.MathUtils.lerp(physics.throttle, 1, dt * 2);
            else if (keys.s) physics.throttle = THREE.MathUtils.lerp(physics.throttle, -0.5, dt * 2);
            else physics.throttle = THREE.MathUtils.lerp(physics.throttle, 0, dt * 4);

            let thrust = physics.throttle * physics.acceleration;
            physics.speed += thrust * dt;
            physics.speed *= Math.pow(physics.drag, dt * 60);

            let steerDir = 0;
            if (keys.a) steerDir = 1;
            if (keys.d) steerDir = -1;
            
            let turnEffectiveness = Math.min(Math.abs(physics.speed) / 5, 1);
            physics.heading += steerDir * turnEffectiveness * dt * 1.5;

            boat.position.x += Math.sin(physics.heading) * physics.speed * dt;
            boat.position.z += Math.cos(physics.heading) * physics.speed * dt;
            boat.rotation.y = physics.heading;

            // Dynamics
            let speedRatio = Math.abs(physics.speed) / physics.maxSpeed;
            let pitch = (physics.speed > 1) ? Math.sin(Math.min(speedRatio * 2.5, 1) * Math.PI) * 0.15 : 0;
            let roll = steerDir * turnEffectiveness * speedRatio * 0.4;
            
            boat.rotation.x = THREE.MathUtils.lerp(boat.rotation.x, -pitch, dt * 5);
            boat.rotation.z = THREE.MathUtils.lerp(boat.rotation.z, -roll, dt * 5);
            boat.position.y = Math.sin(boat.position.x * 0.1 + time) * 0.2;

            // Dynamic Waves
            wakeTimer += dt;
            if (wakeTimer > 0.25 && Math.abs(physics.speed) > 2) {
                wakes.push({ x: boat.position.x, z: boat.position.z, time: time, size: Math.abs(physics.speed) * 0.04 });
                if (wakes.length > 15) wakes.shift();
                wakeTimer = 0;
            }

            const positions = waterGeometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                let vx = originalPositions[i] + water.position.x;
                let vz = originalPositions[i+2] + water.position.z;
                
                let h = Math.sin(vx * 0.1 + time * 2) * 0.2 + Math.cos(vz * 0.1 + time * 1.5) * 0.2;

                for (let w of wakes) {
                    let dx = vx - w.x;
                    let dz = vz - w.z;
                    let dist = Math.sqrt(dx*dx + dz*dz);
                    let age = time - w.time;
                    let waveRadius = age * 4.0;
                    
                    let diff = Math.abs(dist - waveRadius);
                    if (diff < 3.0 && age < 4.0) {
                        h += Math.sin((diff - 3.0) * Math.PI) * w.size * (1 - age/4.0);
                    }
                }
                positions[i+1] = h;
            }
            waterGeometry.attributes.position.needsUpdate = true;
            waterGeometry.computeVertexNormals();

            // Camera
            const camOffset = new THREE.Vector3(
                -Math.sin(physics.heading) * 12,
                4 + pitch * 4,
                -Math.cos(physics.heading) * 12
            );
            camera.position.lerp(boat.position.clone().add(camOffset), dt * 5);
            camera.lookAt(boat.position.x, boat.position.y + 1, boat.position.z);

            water.position.x = Math.round(boat.position.x / 10) * 10;
            water.position.z = Math.round(boat.position.z / 10) * 10;

            // UI
            uiSpeed.innerHTML = `${Math.abs(physics.speed * 3.6).toFixed(0)} <span style="font-size:12px">km/h</span>`;
            uiRpm.innerText = (800 + Math.abs(physics.throttle) * 4700).toFixed(0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
